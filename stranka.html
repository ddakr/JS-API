<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JS--API</title>
<link rel="stylesheet" href="stylesheet.css">
<style>
  html, body { margin: 0; height: 100%; }
  /* Canvas je fixní vrstva za veškerým obsahem stránky */
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; display: block; }
  /* Tvůj obsah – klidně smaž a vlož vlastní */
  main { min-height: 100%; display: grid; place-items: center; font: 600 clamp(28px, 6vw, 64px)/1.1 Georgia, serif; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.35); text-align: center; padding: 1rem; }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
    <div class="intro">   
        <h1>Vítejte na vyhledávači aut</h1>
        <div class="menu">
            <form action="" id="vyhledavac">
                <input type="text"placeholder="Napiš název auta:např:'BMW'" id="auto-vyhledavac" name="tlacitko">
                <input type="submit" id="submit" value="Vyhledej" >  
            </form>  
        </div>
        <p id="zprava"></p>
</main>

<div id="vysledky"></div>

<template id="sablona">
  <div class="karta">
    <img>
    <p class="nazev"></p>
  </div>
</template>

<script>
(() => {
  const cv = document.getElementById('bg'), ctx = cv.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, roadY, t = 0, last = performance.now();

  function resize() {
    const d = devicePixelRatio || 1;
    W = innerWidth; H = innerHeight;
    cv.width = W * d; cv.height = H * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
    roadY = H * 0.74;
  }
  addEventListener('resize', resize); resize();

  // Vrstva kopců: rychlost, výška, barva (vzdálenější = pomalejší)
  const hills = [
    { s: 12, h: 0.22, c: '#8fb3c9', f: 0.004 },
    { s: 30, h: 0.14, c: '#5f8fa3', f: 0.007 },
    { s: 60, h: 0.08, c: '#3f6f66', f: 0.011 },
  ];
  // Rozestup sloupků podél silnice
  const posts = 140;

  function drawHills(L) {
    ctx.fillStyle = L.c;
    ctx.beginPath(); ctx.moveTo(0, roadY);
    for (let x = 0; x <= W; x += 8) {
      const y = roadY - H * L.h - Math.sin((x + t * L.s) * L.f) * H * 0.05
                - Math.sin((x + t * L.s) * L.f * 2.3 + 1) * H * 0.02;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, roadY); ctx.fill();
  }

  function drawCar(x, y) {
    const bob = Math.sin(t * 0.09) * 1.2;
    ctx.save(); ctx.translate(x, y + bob);
    // stín
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(0, 30 - bob, 78, 7, 0, 0, 7); ctx.fill();
    // karoserie
    ctx.fillStyle = '#d6402f';
    ctx.beginPath();
    ctx.moveTo(-76, 22); ctx.lineTo(-76, 2); ctx.quadraticCurveTo(-70, -8, -48, -10);
    ctx.lineTo(-30, -30); ctx.quadraticCurveTo(-26, -34, -18, -34); ctx.lineTo(24, -34);
    ctx.quadraticCurveTo(34, -34, 40, -26); ctx.lineTo(54, -10);
    ctx.quadraticCurveTo(76, -6, 78, 6); ctx.lineTo(78, 22); ctx.closePath(); ctx.fill();
    // okna
    ctx.fillStyle = '#cfe6f2';
    ctx.beginPath();
    ctx.moveTo(-26, -12); ctx.lineTo(-14, -28); ctx.lineTo(4, -28); ctx.lineTo(4, -12); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(12, -12); ctx.lineTo(12, -28); ctx.lineTo(24, -28); ctx.lineTo(38, -12); ctx.fill();
    // světlo + kužel světla
    ctx.fillStyle = '#ffe9a6'; ctx.fillRect(70, 0, 8, 6);
    const g = ctx.createLinearGradient(78, 3, 200, 3);
    g.addColorStop(0, 'rgba(255,233,166,.35)'); g.addColorStop(1, 'rgba(255,233,166,0)');
    ctx.fillStyle = g; ctx.beginPath();
    ctx.moveTo(78, 0); ctx.lineTo(200, -14); ctx.lineTo(200, 22); ctx.lineTo(78, 6); ctx.fill();
    // kola
    for (const wx of [-46, 48]) {
      ctx.save(); ctx.translate(wx, 22); ctx.rotate(t * 0.35);
      ctx.fillStyle = '#1c1c1f'; ctx.beginPath(); ctx.arc(0, 0, 15, 0, 7); ctx.fill();
      ctx.fillStyle = '#c9ccd1'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.fill();
      ctx.strokeStyle = '#1c1c1f'; ctx.lineWidth = 2;
      for (let i = 0; i < 5; i++) {
        ctx.rotate(Math.PI * 2 / 5);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(8, 0); ctx.stroke();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function frame(now) {
    const dt = Math.min((now - last) / 16.67, 3); last = now;
    if (!still) t += dt;

    // obloha
    const sky = ctx.createLinearGradient(0, 0, 0, roadY);
    sky.addColorStop(0, '#f6a35c'); sky.addColorStop(0.55, '#f9cf8f'); sky.addColorStop(1, '#fdeccb');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    // slunce
    ctx.fillStyle = '#fff3d1'; ctx.beginPath();
    ctx.arc(W * 0.78, roadY - H * 0.28, Math.min(W, H) * 0.07, 0, 7); ctx.fill();

    hills.forEach(drawHills);

    // tráva + silnice
    ctx.fillStyle = '#2f5a45'; ctx.fillRect(0, roadY - 4, W, H - roadY + 4);
    ctx.fillStyle = '#34363b'; ctx.fillRect(0, roadY + 14, W, H * 0.16);
    const roadH = H * 0.16, midY = roadY + 14 + roadH / 2;
    // okraje silnice
    ctx.fillStyle = '#e8e4d8';
    ctx.fillRect(0, roadY + 14, W, 3); ctx.fillRect(0, roadY + 14 + roadH - 3, W, 3);
    // přerušovaná čára
    ctx.fillStyle = '#f2d34f';
    const dash = 60, gap = 50, off = (t * 7) % (dash + gap);
    for (let x = -dash - gap + off; x < W; x += dash + gap) ctx.fillRect(x, midY - 2, dash, 4);

    // sloupky podél silnice
    ctx.fillStyle = '#e8e4d8';
    const po = (t * 7) % posts;
    for (let x = -posts + po; x < W; x += posts) ctx.fillRect(x, roadY - 10, 4, 22);

    drawCar(Math.min(W * 0.3, 360), midY - 12);

    // popředí
    ctx.fillStyle = '#244a37'; ctx.fillRect(0, roadY + 14 + roadH, W, H);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<script src="script.js"></script>
</body>
</html>
